services:
    # PostgreSQL
    db:
        image: postgres:18.6-alpine3.24
        container_name: support_ticket_postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-postgres}
            POSTGRES_USER: ${DB_USERNAME:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
        volumes:
            - postgredata:/var/lib/postgresql
        ports:
            - '5432:5432'
        networks:
            - jej-postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 10s
            timeout: 5s
            retries: 5

    # pgAdmin
    pgadmin:
        image: dpage/pgadmin4
        container_name: support_ticket_pgadmin
        restart: unless-stopped
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-me@javadeveloper.com.br}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin1234}
        volumes:
            - pgadmin_data:/var/lib/pgadmin
        ports:
            - '8080:80'
        networks:
            - jej-postgresql
        depends_on:
            db:
                condition: service_healthy

networks:
    jej-postgresql:
        driver: bridge

volumes:
    postgredata:
    pgadmin_data:
